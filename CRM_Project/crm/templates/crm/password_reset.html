<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 16px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: 800;

            color: #0f172a;

            margin-bottom: 10px;
        }

        .logo span {
            color: #6366f1;
        }

        h1 {
            text-align: center;

            font-size: 22px;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 700;

            color: #334155;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            margin-bottom: 18px;
        }

        input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #6366f1;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .back-login {
            text-align: center;

            margin-top: 20px;
        }

        .back-login a {
            color: #6366f1;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                CRM<span>.</span>
            </div>

            <h1>
                Forgot Password?
            </h1>

            <p class="description">
                Enter the email address associated with your account.
                We will send you instructions to reset your password.
            </p>


            <form method="POST">

                {% csrf_token %}

                <label for="id_email">
                    Email Address
                </label>

                {{ form.email }}

                <button type="submit">
                    Send Reset Link
                </button>

            </form>


            <div class="back-login">

                <a href="{% url 'login' %}">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
