<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Changed | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 16px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.08);

            text-align: center;
        }

        .logo {
            font-size: 30px;

            font-weight: 800;

            color: #0f172a;

            margin-bottom: 25px;
        }

        .logo span {
            color: #6366f1;
        }

        .success-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: #dcfce7;

            color: #16a34a;

            font-size: 30px;

            font-weight: 800;
        }

        h1 {
            font-size: 22px;

            margin-bottom: 12px;
        }

        p {
            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .login-btn {
            display: block;

            width: 100%;

            padding: 13px;

            border-radius: 8px;

            background: #6366f1;

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;
        }

        .login-btn:hover {
            background: #4f46e5;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                CRM<span>.</span>
            </div>

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Password Changed Successfully
            </h1>

            <p>
                Your password has been updated successfully.
                You can now login to your CRM account using
                your new password.
            </p>

            <a
                href="{% url 'login' %}"
                class="login-btn"
            >
                Login to CRM
            </a>

        </div>

    </div>

</body>

</html>
