<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Email Sent | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 16px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.08);

            text-align: center;
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: #eef2ff;

            font-size: 28px;
        }

        .logo {
            font-size: 30px;

            font-weight: 800;

            color: #0f172a;

            margin-bottom: 25px;
        }

        .logo span {
            color: #6366f1;
        }

        h1 {
            font-size: 22px;

            margin-bottom: 12px;
        }

        p {
            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .back-login {
            display: inline-block;

            color: #6366f1;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;
        }

        .back-login:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                CRM<span>.</span>
            </div>

            <div class="icon">
                ✉️
            </div>

            <h1>
                Check Your Email
            </h1>

            <p>
                If an account exists with the email address
                you entered, we have sent instructions to
                reset your password.
            </p>

            <a
                href="{% url 'login' %}"
                class="back-login"
            >
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
