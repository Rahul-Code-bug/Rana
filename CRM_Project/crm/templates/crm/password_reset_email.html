<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CRM Password Reset</title>
</head>

<body style="
    margin: 0;
    padding: 40px 20px;
    background: #f8fafc;
    font-family: Arial, sans-serif;
">

    <div style="
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        text-align: center;
    ">

        <h1 style="
            margin-bottom: 10px;
            color: #0f172a;
        ">
            CRM<span style="color: #6366f1;">.</span>
        </h1>

        <h2 style="
            color: #0f172a;
            margin-bottom: 15px;
        ">
            Password Reset
        </h2>

        <p style="
            color: #64748b;
            line-height: 1.6;
        ">
            You requested a password reset for your CRM account.
        </p>

        <p style="
            color: #64748b;
            line-height: 1.6;
        ">
            Click the button below to create a new password.
        </p>

        <div style="margin: 30px 0;">

            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="
                    display: inline-block;
                    padding: 13px 25px;
                    background: #6366f1;
                    color: white;
                    text-decoration: none;
                    border-radius: 8px;
                    font-weight: 700;
                ">
                Reset Password
            </a>

        </div>

        <p style="
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        ">
            If you did not request a password reset,
            you can safely ignore this email.
        </p>

    </div>

</body>

</html>
