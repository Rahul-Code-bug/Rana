<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Task | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
        }

        .page {
            padding: 40px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 700;
        }

        .back:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .form-card {
            background: white;
            padding: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .05);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: #4f46e5;
        }

    </style>

</head>


<body>

    <main class="container">

        <div class="page">

            <a
                href="{% url 'task_list' %}"
                class="back"
            >
                ← Back to Tasks
            </a>


            <div class="form-card">

                <h1>
                    Edit Task
                </h1>

                <p class="subtitle">
                    Update your CRM task details.
                </p>


                <form method="POST">

                    {% csrf_token %}


                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Task Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="{{ task.title }}"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                        >{{ task.description }}</textarea>

                    </div>


                    <!-- DUE DATE -->

                    <div class="form-group">

                        <label for="due_date">
                            Due Date
                        </label>

                        <input
                            type="date"
                            id="due_date"
                            name="due_date"
                            value="{{ task.due_date|date:'Y-m-d' }}"
                        >

                    </div>


                    <!-- PRIORITY -->

                    <div class="form-group">

                        <label for="priority">
                            Priority
                        </label>

                        <select
                            id="priority"
                            name="priority"
                        >

                            <option
                                value="Low"
                                {% if task.priority == "Low" %}selected{% endif %}
                            >
                                Low
                            </option>

                            <option
                                value="Medium"
                                {% if task.priority == "Medium" %}selected{% endif %}
                            >
                                Medium
                            </option>

                            <option
                                value="High"
                                {% if task.priority == "High" %}selected{% endif %}
                            >
                                High
                            </option>

                        </select>

                    </div>


                    <!-- STATUS -->

                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                        >

                            <option
                                value="Pending"
                                {% if task.status == "Pending" %}selected{% endif %}
                            >
                                Pending
                            </option>

                            <option
                                value="In Progress"
                                {% if task.status == "In Progress" %}selected{% endif %}
                            >
                                In Progress
                            </option>

                            <option
                                value="Completed"
                                {% if task.status == "Completed" %}selected{% endif %}
                            >
                                Completed
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Update Task
                    </button>


                </form>

            </div>

        </div>

    </main>

</body>

</html>
