<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Customer | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: auto;
        }

        .page {
            padding: 50px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 700;
        }

        .back:hover {
            color: #4f46e5;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .05);
        }

        .card h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .1);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .save-btn {
            border: none;
            background: #6366f1;
            color: white;
        }

        .save-btn:hover {
            background: #4f46e5;
        }

        .cancel-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .cancel-btn:hover {
            background: #e2e8f0;
        }

        @media (max-width: 600px) {

            .page {
                padding: 30px 0;
            }

            .card {
                padding: 25px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>

    <main class="container">

        <div class="page">

            <a
                href="{% url 'customer_list' %}"
                class="back"
            >
                ← Back to Customers
            </a>


            <div class="card">

                <h1>
                    Add Customer
                </h1>

                <p class="subtitle">
                    Add a new customer to your CRM.
                </p>


                <form method="POST">

                    {% csrf_token %}


                    <div class="form-group">

                        <label>
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Customer name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="Customer email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            placeholder="Phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Company
                        </label>

                        <input
                            type="text"
                            name="company"
                            placeholder="Company name"
                        >

                    </div>


                    <div class="actions">

                        <button
                            type="submit"
                            class="btn save-btn"
                        >
                            Save Customer
                        </button>


                        <a
                            href="{% url 'customer_list' %}"
                            class="btn cancel-btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</body>

</html>
