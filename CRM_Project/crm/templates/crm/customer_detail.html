<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ customer.name }} | CRM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .page-header {
            padding: 35px 0;
        }

        .back {
            color: #6366f1;
            text-decoration: none;
            font-weight: 700;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 35px;
            box-shadow:
                0 10px 30px rgba(15, 23, 42, .05);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            font-size: 28px;
            font-weight: 800;
        }

        .profile h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .profile p {
            color: #64748b;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .detail {
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .detail small {
            display: block;
            color: #64748b;
            margin-bottom: 6px;
        }

        .detail strong {
            font-size: 16px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 11px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        .edit {
            background: #6366f1;
            color: white;
        }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
        }
        
        .delete {
            background: #fee2e2;
            color: #dc2626;
        }

        .delete:hover {
            background: #fecaca;
        }

        @media (max-width: 600px) {

            .details {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }

        }
    </style>

</head>


<body>

    <header class="page-header">

        <div class="container">

            <a href="{% url 'customer_list' %}" class="back">
                ← Back to Customers
            </a>

        </div>

    </header>


    <main class="container">

        <div class="card">


            <div class="profile">

                <div class="avatar">

                    {{ customer.name|first|upper }}

                </div>

                <div>

                    <h1>
                        {{ customer.name }}
                    </h1>

                    <p>
                        Customer Profile
                    </p>

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <small>
                        Email
                    </small>

                    <strong>
                        {{ customer.email }}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Phone
                    </small>

                    <strong>
                        {{ customer.phone }}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Company
                    </small>

                    <strong>
                        {{ customer.company|default:"Not provided" }}
                    </strong>

                </div>


                <div class="detail">

                    <small>
                        Customer ID
                    </small>

                    <strong>
                        #{{ customer.id }}
                    </strong>

                </div>


            </div>


            <div class="actions">

                <a href="{% url 'customer_edit' customer.id %}" class="btn edit">
                    Edit Customer
                </a>
                <a href="{% url 'customer_delete' customer.id %}" class="btn delete">
                    Delete Customer
                </a>
                <a href="{% url 'customer_list' %}" class="btn back-btn">
                    Back
                </a>

            </div>


        </div>

    </main>

</body>

</html>
