<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Customer | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
        }

        .page {
            padding: 50px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 700;
        }

        .back:hover {
            color: #4f46e5;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        }

        .card h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .primary {
            background: #6366f1;
            color: white;
        }

        .primary:hover {
            background: #4f46e5;
        }

        .secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .secondary:hover {
            background: #e2e8f0;
        }

        @media (max-width: 600px) {

            .page {
                padding: 30px 0;
            }

            .card {
                padding: 25px;
            }

            .card h1 {
                font-size: 26px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>


<body>

    <main class="container">

        <div class="page">

            <a href="{% url 'customer_list' %}" class="back">
                ← Back to Customers
            </a>


            <div class="card">

                <h1>
                    Edit Customer
                </h1>

                <p class="subtitle">
                    Update customer information
                </p>


                <form method="POST">

                    {% csrf_token %}


                    <div class="form-group">

                        <label>
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            value="{{ customer.name }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            value="{{ customer.email }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ customer.phone }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Company
                        </label>

                        <input
                            type="text"
                            name="company"
                            value="{{ customer.company }}"
                        >

                    </div>


                    <div class="actions">

                        <button
                            type="submit"
                            class="btn primary"
                        >
                            Update Customer
                        </button>


                        <a
                            href="{% url 'customer_list' %}"
                            class="btn secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</body>

</html>
