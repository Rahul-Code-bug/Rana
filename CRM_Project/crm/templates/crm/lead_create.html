<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Lead | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
        }

        .page {
            padding: 50px 0;
        }

        .back {
            color: #6366f1;
            text-decoration: none;
            font-weight: 700;
        }

        .card {
            margin-top: 25px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow:
                0 0 0 3px rgba(99, 102, 241, .1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: #4f46e5;
        }

    </style>

</head>


<body>

    <main class="container page">

        <a
            href="{% url 'lead_list' %}"
            class="back"
        >
            ← Back to Leads
        </a>


        <div class="card">

            <h1>
                Add New Lead
            </h1>

            <p class="description">
                Add a potential customer to your CRM.
            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter lead name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="company">
                        Company
                    </label>

                    <input
                        type="text"
                        id="company"
                        name="company"
                        placeholder="Company name"
                    >

                </div>


                <div class="form-group">

                    <label for="source">
                        Lead Source
                    </label>

                    <input
                        type="text"
                        id="source"
                        name="source"
                        placeholder="e.g. Website, Facebook, Referral"
                    >

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status" name="status">

                        <option value="New">
                            New
                        </option>

                        <option value="Contacted">
                            Contacted
                        </option>

                        <option value="Qualified">
                            Qualified
                        </option>

                        <option value="Converted">
                            Converted
                        </option>

                        <option value="Lost">
                            Lost
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="Add notes about this lead..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Add Lead
                </button>

            </form>

        </div>

    </main>

</body>

</html>
