<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Lead | CRM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: auto;
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .card {
            width: 100%;
            background: white;
            padding: 35px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(15, 23, 42, .08);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: #fee2e2;
            color: #dc2626;

            font-size: 28px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        strong {
            color: #0f172a;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .cancel {
            background: #eef2ff;
            color: #4f46e5;
        }

        @media (max-width: 500px) {

            .card {
                padding: 25px 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <main class="container">

        <div class="page">

            <div class="card">

                <div class="icon">
                    ⚠
                </div>

                <h1>
                    Delete Lead?
                </h1>

                <p>
                    Are you sure you want to delete
                    <strong>{{ lead.name }}</strong>?
                    This action cannot be undone.
                </p>

                <div class="actions">

                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn delete"
                        >
                            Yes, Delete
                        </button>

                    </form>

                    <a
                        href="{% url 'lead_detail' lead.id %}"
                        class="btn cancel"
                    >
                        Cancel
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
