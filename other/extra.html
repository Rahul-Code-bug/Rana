<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidVault - Your Video Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* --- SAME STYLES (UNCHANGED) --- */
:root {
    --neon-cyan:#00ffff;
    --neon-pink:#ff006e;
    --neon-purple:#8b5cf6;
    --deep-blue:#0a0e27;
    --dark-purple:#1a0f2e;
    --electric-blue:#3b82f6;
    --soft-white:#f0f4f8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Rubik',sans-serif;
    background:linear-gradient(135deg,var(--deep-blue),var(--dark-purple));
    color:var(--soft-white);
    min-height:100vh;
}
.container{max-width:1400px;margin:auto;padding:2rem}
header{text-align:center;margin-bottom:2rem}
h1{
    font-family:'Orbitron';
    font-size:3rem;
    background:linear-gradient(135deg,var(--neon-cyan),var(--neon-pink),var(--neon-purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.main-content{display:grid;grid-template-columns:1fr 380px;gap:2rem}
.video-player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.video-player iframe{width:100%;height:100%}
.no-video-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    color:var(--neon-cyan);
}
.control-btn{padding:1rem;border:2px solid var(--neon-cyan);background:none;color:var(--neon-cyan);cursor:pointer}
.sidebar{display:flex;flex-direction:column;gap:2rem}
.playlist-item{padding:1rem;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.05)}
.playlist-item.active{border:2px solid var(--neon-cyan)}
.delete-btn{background:none;border:none;color:var(--neon-pink);cursor:pointer}
</style>
</head>

<body>
<div class="container">
<header>
<h1>VIDVAULT</h1>
<p>Your Retro Video Archive</p>
</header>

<div class="main-content">
<div>
<div class="video-player" id="videoPlayer">
<div class="no-video-placeholder">Add videos to start watching</div>
</div>

<h2 id="currentVideoTitle">No video selected</h2>

<button class="control-btn" id="prevBtn" disabled>⏮ Prev</button>
<button class="control-btn" id="nextBtn" disabled>Next ⏭</button>
</div>

<div class="sidebar">
<form id="addVideoForm">
<input id="titleInput" placeholder="Video title" required>
<input id="urlInput" placeholder="YouTube URL" required>
<button>Add Video</button>
</form>

<div id="playlist"></div>
</div>
</div>
</div>

<script>
let videos = [];
let currentIndex = -1;

const player = document.getElementById("videoPlayer");
const titleText = document.getElementById("currentVideoTitle");
const playlist = document.getElementById("playlist");

function getYouTubeId(url){
    const match = url.match(/(?:v=|youtu\.be\/)([^&]+)/);
    return match ? match[1] : null;
}

function renderPlaylist(){
    playlist.innerHTML = "";
    videos.forEach((v,i)=>{
        const item = document.createElement("div");
        item.className = "playlist-item" + (i===currentIndex?" active":"");
        item.innerHTML = `
            <span>${v.title}</span>
            <button class="delete-btn">✕</button>
        `;
        item.onclick = ()=>playVideo(i);
        item.querySelector("button").onclick = e=>{
            e.stopPropagation();
            videos.splice(i,1);
            if(currentIndex>=videos.length) currentIndex--;
            renderPlaylist();
            if(videos.length) playVideo(Math.max(0,currentIndex));
            else resetPlayer();
        };
        playlist.appendChild(item);
    });
}

function playVideo(i){
    currentIndex=i;
    player.innerHTML = `<iframe src="https://www.youtube.com/embed/${videos[i].id}?autoplay=1" allowfullscreen></iframe>`;
    titleText.textContent = videos[i].title;
    renderPlaylist();
    updateButtons();
}

function resetPlayer(){
    player.innerHTML = `<div class="no-video-placeholder">Add videos to start watching</div>`;
    titleText.textContent="No video selected";
    updateButtons();
}

function updateButtons(){
    prevBtn.disabled = currentIndex<=0;
    nextBtn.disabled = currentIndex>=videos.length-1;
}

addVideoForm.onsubmit=e=>{
    e.preventDefault();
    const id=getYouTubeId(urlInput.value);
    if(!id) return alert("Invalid YouTube URL");
    videos.push({title:titleInput.value,id});
    titleInput.value=urlInput.value="";
    if(videos.length===1) playVideo(0);
    else renderPlaylist();
};
prevBtn.onclick=()=>playVideo(currentIndex-1);
nextBtn.onclick=()=>playVideo(currentIndex+1);
</script>
</body>
</html>
