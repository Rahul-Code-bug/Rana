<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wavelength — YouTube Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       CSS VARIABLES & RESET
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0f;
      --surface:     #111118;
      --surface2:    #1a1a24;
      --surface3:    #22222f;
      --border:      rgba(255,255,255,0.07);
      --accent:      #7c6dfa;
      --accent2:     #fa6d8f;
      --accent-glow: rgba(124,109,250,0.35);
      --text:        #e8e8f0;
      --text-muted:  #6b6b80;
      --text-dim:    #3a3a4a;
      --radius:      14px;
      --radius-sm:   8px;
      --font-display: 'Syne', sans-serif;
      --font-mono:    'DM Mono', monospace;
      --transition:  0.2s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* =============================================
       BACKGROUND ATMOSPHERE
    ============================================= */
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      pointer-events: none; z-index: 0; opacity: 0.18;
    }
    .bg-orb-1 { width: 500px; height: 500px; background: var(--accent); top: -120px; left: -100px; }
    .bg-orb-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -80px; right: -80px; }

    /* =============================================
       LAYOUT WRAPPER
    ============================================= */
    .app {
      position: relative; z-index: 1;
      width: 100%; max-width: 820px;
      padding: 28px 20px 120px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* =============================================
       HEADER
    ============================================= */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4px;
    }
    .logo {
      font-size: 1.6rem; font-weight: 800; letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo span { color: var(--accent); -webkit-text-fill-color: var(--accent); }
    .header-tag {
      font-family: var(--font-mono); font-size: 0.65rem;
      color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px;
    }

    /* =============================================
       CARD BASE
    ============================================= */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    /* =============================================
       URL INPUT SECTION
    ============================================= */
    .input-row {
      display: flex; gap: 10px; align-items: stretch;
    }
    .url-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .url-input::placeholder { color: var(--text-dim); }
    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn {
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.82rem;
      border: none; cursor: pointer;
      border-radius: var(--radius-sm);
      padding: 11px 18px;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
      letter-spacing: 0.03em;
    }
    .btn-primary:hover { background: #9183fb; box-shadow: 0 0 18px var(--accent-glow); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      background: var(--surface2); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface3); color: var(--text); }

    .input-label {
      font-size: 0.72rem; font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 10px;
    }

    /* =============================================
       NOW PLAYING CARD
    ============================================= */
    .now-playing {
      display: flex; flex-direction: column; gap: 18px;
    }

    /* Hidden YouTube iframe container */
    .yt-iframe-wrap {
      width: 1px; height: 1px; overflow: hidden;
      position: absolute; left: -9999px; top: -9999px;
      opacity: 0; pointer-events: none;
    }
    #yt-player { width: 1px; height: 1px; }

    /* Album art / visualizer placeholder */
    .art-wrap {
      position: relative;
      width: 100%; aspect-ratio: 1/1;
      max-width: 200px; margin: 0 auto;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: box-shadow 0.4s;
    }
    .art-wrap.playing {
      box-shadow: 0 0 0 8px rgba(124,109,250,0.08), 0 0 40px var(--accent-glow);
      animation: spin 18s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .art-inner {
      width: 72%; height: 72%; border-radius: 50%;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      position: relative; z-index: 1;
    }
    .art-ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(var(--accent) 0%, var(--accent2) 50%, var(--surface2) 50%);
      opacity: 0.3;
    }

    .track-info {
      text-align: center;
    }
    .track-title {
      font-size: 1.05rem; font-weight: 700;
      color: var(--text); line-height: 1.3;
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-subtitle {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* =============================================
       PROGRESS BAR
    ============================================= */
    .progress-section { display: flex; flex-direction: column; gap: 6px; }
    .time-row {
      display: flex; justify-content: space-between;
      font-family: var(--font-mono); font-size: 0.67rem;
      color: var(--text-muted);
    }
    .progress-track {
      width: 100%; height: 4px;
      background: var(--surface3);
      border-radius: 2px; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%; transition: width 0.3s linear;
      pointer-events: none;
    }
    .progress-track:hover .progress-fill { filter: brightness(1.2); }

    /* =============================================
       CONTROLS
    ============================================= */
    .controls-row {
      display: flex; align-items: center; justify-content: center;
      gap: 16px;
    }
    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); font-size: 1.1rem;
    }
    .ctrl-btn:hover { background: var(--surface2); color: var(--text); }
    .ctrl-btn.active { color: var(--accent); }

    .play-btn {
      width: 54px; height: 54px;
      background: var(--accent); color: #fff;
      font-size: 1.35rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .play-btn:hover { background: #9183fb; transform: scale(1.05); box-shadow: 0 6px 28px var(--accent-glow); color: #fff; }
    .play-btn:active { transform: scale(0.97); }

    /* Volume */
    .volume-row {
      display: flex; align-items: center; gap: 10px;
    }
    .vol-icon { font-size: 0.95rem; color: var(--text-muted); flex-shrink: 0; }
    .vol-slider {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 4px;
      background: var(--surface3);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent);
      cursor: pointer; transition: box-shadow var(--transition);
    }
    .vol-slider::-webkit-slider-thumb:hover { box-shadow: 0 0 8px var(--accent-glow); }
    .vol-val {
      font-family: var(--font-mono); font-size: 0.68rem;
      color: var(--text-muted); min-width: 28px; text-align: right;
    }

    /* =============================================
       PLAYLIST SECTION
    ============================================= */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 0.72rem; font-weight: 700;
      color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;
    }
    .badge {
      font-family: var(--font-mono); font-size: 0.62rem;
      background: var(--surface2); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 7px;
    }

    .playlist-list { display: flex; flex-direction: column; gap: 6px; }
    .pl-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      position: relative; overflow: hidden;
    }
    .pl-item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent); opacity: 0;
      transition: opacity var(--transition);
    }
    .pl-item:hover { background: var(--surface3); border-color: rgba(124,109,250,0.2); }
    .pl-item:hover::before { opacity: 1; }
    .pl-item.active { border-color: rgba(124,109,250,0.35); background: rgba(124,109,250,0.07); }
    .pl-item.active::before { opacity: 1; }

    .pl-num {
      font-family: var(--font-mono); font-size: 0.65rem;
      color: var(--text-dim); min-width: 18px; text-align: center;
    }
    .pl-item.active .pl-num { color: var(--accent); }
    .pl-info { flex: 1; min-width: 0; }
    .pl-title {
      font-size: 0.82rem; font-weight: 600;
      color: var(--text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pl-url {
      font-family: var(--font-mono); font-size: 0.63rem;
      color: var(--text-dim); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pl-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-size: 0.9rem; padding: 4px;
      border-radius: 4px; transition: all var(--transition);
      opacity: 0;
    }
    .pl-item:hover .pl-remove { opacity: 1; }
    .pl-remove:hover { color: var(--accent2); background: rgba(250,109,143,0.1); }

    .pl-empty {
      text-align: center; padding: 28px;
      color: var(--text-dim);
      font-family: var(--font-mono); font-size: 0.75rem;
      border: 1px dashed var(--border); border-radius: var(--radius-sm);
    }

    /* =============================================
       LOADING SPINNER
    ============================================= */
    .loader {
      display: none; align-items: center; justify-content: center;
      gap: 8px; padding: 12px 0;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
    }
    .loader.visible { display: flex; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: rotate 0.7s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }

    /* =============================================
       TOAST NOTIFICATION
    ============================================= */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 18px;
      font-size: 0.78rem; color: var(--text);
      opacity: 0; pointer-events: none;
      transition: all 0.3s; z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* =============================================
       KEYBOARD HINT
    ============================================= */
    .kbd-hints {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      padding: 0 4px;
    }
    .kbd-hint {
      display: flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 0.62rem;
      color: var(--text-dim);
    }
    kbd {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 6px;
      font-family: var(--font-mono); font-size: 0.62rem;
      color: var(--text-muted);
    }

    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (min-width: 560px) {
      .now-playing {
        flex-direction: row; align-items: flex-start;
      }
      .now-playing .left-col {
        flex-shrink: 0; width: 180px;
      }
      .now-playing .right-col {
        flex: 1; display: flex; flex-direction: column;
        gap: 16px; justify-content: center;
        padding-top: 8px;
      }
      .track-info { text-align: left; }
      .art-wrap { max-width: 180px; }
    }

    @media (max-width: 400px) {
      .controls-row { gap: 10px; }
      .play-btn { width: 48px; height: 48px; font-size: 1.15rem; }
    }
  </style>
</head>
<body>

<!-- Atmospheric background orbs -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<!-- Hidden YouTube player -->
<div class="yt-iframe-wrap" aria-hidden="true">
  <div id="yt-player"></div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<div class="app">

  <!-- ── Header ─────────────────────────────── -->
  <header>
    <div class="logo">Wave<span>~</span>length</div>
    <div class="header-tag">YT Audio Player</div>
  </header>

  <!-- ── URL Input Card ─────────────────────── -->
  <div class="card">
    <div class="input-label">Paste YouTube URL</div>
    <div class="input-row">
      <input
        class="url-input" id="url-input"
        type="text"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off" spellcheck="false"
      />
      <button class="btn btn-primary" id="btn-play-url">▶ Play</button>
      <button class="btn btn-ghost"   id="btn-add-queue">+ Queue</button>
    </div>
    <!-- Loading state -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Loading track…</span>
    </div>
  </div>

  <!-- ── Now Playing Card ───────────────────── -->
  <div class="card">
    <div class="now-playing">
      <!-- Left: Art -->
      <div class="left-col">
        <div class="art-wrap" id="art-wrap">
          <div class="art-ring"></div>
          <div class="art-inner" id="art-emoji">🎵</div>
        </div>
      </div>

      <!-- Right: Info + Controls -->
      <div class="right-col">
        <!-- Track info -->
        <div class="track-info">
          <div class="track-title" id="track-title">No track loaded</div>
          <div class="track-subtitle" id="track-sub">— Add a YouTube URL above —</div>
        </div>

        <!-- Progress bar -->
        <div class="progress-section">
          <div class="time-row">
            <span id="time-cur">0:00</span>
            <span id="time-dur">0:00</span>
          </div>
          <div class="progress-track" id="progress-track" title="Click to seek">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <!-- Playback Controls -->
        <div class="controls-row">
          <button class="ctrl-btn" id="btn-prev" title="Previous (←)">⏮</button>
          <button class="ctrl-btn" id="btn-rew"  title="Rewind 10s">⏪</button>
          <button class="ctrl-btn play-btn" id="btn-playpause" title="Play/Pause (Space)">▶</button>
          <button class="ctrl-btn" id="btn-fwd"  title="Forward 10s">⏩</button>
          <button class="ctrl-btn" id="btn-next" title="Next (→)">⏭</button>
        </div>

        <!-- Volume -->
        <div class="volume-row">
          <span class="vol-icon" id="vol-icon">🔊</span>
          <input class="vol-slider" id="vol-slider" type="range" min="0" max="100" value="80" title="Volume"/>
          <span class="vol-val" id="vol-val">80%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Playlist Card ──────────────────────── -->
  <div class="card">
    <div class="section-header">
      <div class="section-title">Playlist</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="badge" id="pl-count">0 tracks</span>
        <button class="btn btn-ghost" id="btn-clear-pl" style="font-size:0.72rem;padding:5px 10px;">Clear all</button>
      </div>
    </div>
    <div class="playlist-list" id="playlist-list">
      <div class="pl-empty" id="pl-empty">Queue is empty — add tracks above</div>
    </div>
  </div>

  <!-- ── Keyboard hints ─────────────────────── -->
  <div class="kbd-hints">
    <div class="kbd-hint"><kbd>Space</kbd> Play / Pause</div>
    <div class="kbd-hint"><kbd>←</kbd> Prev track</div>
    <div class="kbd-hint"><kbd>→</kbd> Next track</div>
    <div class="kbd-hint"><kbd>↑↓</kbd> Volume</div>
    <div class="kbd-hint"><kbd>M</kbd> Mute</div>
  </div>

</div>

<!-- =============================================
     YOUTUBE IFRAME API SCRIPT
============================================= -->
<script>
/* -----------------------------------------------
   1.  Load YouTube IFrame API
----------------------------------------------- */
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

/* -----------------------------------------------
   2.  State
----------------------------------------------- */
var player         = null;   // YT.Player instance
var playerReady    = false;
var isPlaying      = false;
var isMuted        = false;
var progressTimer  = null;
var currentIdx     = -1;     // active playlist index

// Persistent playlist stored in localStorage
var playlist = JSON.parse(localStorage.getItem('wl_playlist') || '[]');
// Each item: { url, videoId, title }

/* -----------------------------------------------
   3.  DOM refs
----------------------------------------------- */
var urlInput      = document.getElementById('url-input');
var btnPlayUrl    = document.getElementById('btn-play-url');
var btnAddQueue   = document.getElementById('btn-add-queue');
var btnPlayPause  = document.getElementById('btn-playpause');
var btnPrev       = document.getElementById('btn-prev');
var btnNext       = document.getElementById('btn-next');
var btnRew        = document.getElementById('btn-rew');
var btnFwd        = document.getElementById('btn-fwd');
var volSlider     = document.getElementById('vol-slider');
var volVal        = document.getElementById('vol-val');
var volIcon       = document.getElementById('vol-icon');
var progressTrack = document.getElementById('progress-track');
var progressFill  = document.getElementById('progress-fill');
var timeCur       = document.getElementById('time-cur');
var timeDur       = document.getElementById('time-dur');
var trackTitle    = document.getElementById('track-title');
var trackSub      = document.getElementById('track-sub');
var artWrap       = document.getElementById('art-wrap');
var artEmoji      = document.getElementById('art-emoji');
var plList        = document.getElementById('playlist-list');
var plCount       = document.getElementById('pl-count');
var plEmpty       = document.getElementById('pl-empty');
var btnClearPl    = document.getElementById('btn-clear-pl');
var loader        = document.getElementById('loader');
var toast         = document.getElementById('toast');

/* -----------------------------------------------
   4.  YouTube IFrame API callback
----------------------------------------------- */
window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('yt-player', {
    height: '1', width: '1',
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      modestbranding: 1,
      rel: 0
    },
    events: {
      onReady:       onPlayerReady,
      onStateChange: onPlayerStateChange,
      onError:       onPlayerError
    }
  });
};

function onPlayerReady(e) {
  playerReady = true;
  player.setVolume(parseInt(volSlider.value));
  // Restore playlist from storage and render
  renderPlaylist();
  showToast('Player ready 🎧');
}

function onPlayerStateChange(e) {
  // YT.PlayerState: UNSTARTED=-1, ENDED=0, PLAYING=1, PAUSED=2, BUFFERING=3, CUED=5
  if (e.data === YT.PlayerState.PLAYING) {
    isPlaying = true;
    btnPlayPause.textContent = '⏸';
    artWrap.classList.add('playing');
    startProgressTimer();
    // Update title from player data
    var videoData = player.getVideoData();
    if (videoData && videoData.title) {
      updateTrackDisplay(videoData.title, extractVideoId(urlInput.value) || '');
      // Also update playlist item title if it was 'Loading…'
      if (currentIdx >= 0 && playlist[currentIdx]) {
        playlist[currentIdx].title = videoData.title;
        savePlaylist();
        renderPlaylist();
      }
    }
  } else if (e.data === YT.PlayerState.PAUSED) {
    isPlaying = false;
    btnPlayPause.textContent = '▶';
    artWrap.classList.remove('playing');
    stopProgressTimer();
  } else if (e.data === YT.PlayerState.ENDED) {
    isPlaying = false;
    btnPlayPause.textContent = '▶';
    artWrap.classList.remove('playing');
    stopProgressTimer();
    // Auto-advance
    playNext();
  } else if (e.data === YT.PlayerState.BUFFERING) {
    setLoader(true);
  }
  if (e.data === YT.PlayerState.PLAYING) setLoader(false);
}

function onPlayerError(e) {
  setLoader(false);
  showToast('Error loading video — try another URL');
}

/* -----------------------------------------------
   5.  Extract video ID from URL
----------------------------------------------- */
function extractVideoId(url) {
  if (!url) return null;
  url = url.trim();
  // youtu.be/ID
  var m = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  // ?v=ID or &v=ID
  m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  // /embed/ID
  m = url.match(/\/embed\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  // /shorts/ID
  m = url.match(/\/shorts\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  // bare 11-char ID
  if (/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
  return null;
}

/* -----------------------------------------------
   6.  Play a video by ID
----------------------------------------------- */
function loadAndPlay(videoId, title) {
  if (!playerReady) { showToast('Player not ready yet…'); return; }
  if (!videoId) { showToast('Invalid YouTube URL'); return; }
  setLoader(true);
  player.loadVideoById({ videoId: videoId, startSeconds: 0 });
  updateTrackDisplay(title || 'Loading…', videoId);
  artEmoji.textContent = '🎵';
}

function updateTrackDisplay(title, videoId) {
  trackTitle.textContent = title;
  trackSub.textContent   = videoId ? 'youtu.be/' + videoId : '—';
  // Rotate emoji based on first char for fun variety
  var emojis = ['🎵','🎶','🎸','🎹','🥁','🎷','🎺','🎻','🎤','🎧'];
  artEmoji.textContent = emojis[videoId.charCodeAt(0) % emojis.length] || '🎵';
}

/* -----------------------------------------------
   7.  Button actions
----------------------------------------------- */
// Play URL directly
btnPlayUrl.addEventListener('click', function() {
  var url = urlInput.value.trim();
  var vid = extractVideoId(url);
  if (!vid) { showToast('Please enter a valid YouTube URL'); return; }
  // Add to playlist if not there
  var exists = playlist.findIndex(function(p){ return p.videoId === vid; });
  if (exists === -1) {
    playlist.push({ url: url, videoId: vid, title: 'Loading…' });
    savePlaylist();
    currentIdx = playlist.length - 1;
  } else {
    currentIdx = exists;
  }
  renderPlaylist();
  loadAndPlay(vid);
});

// Add to queue without playing
btnAddQueue.addEventListener('click', function() {
  var url = urlInput.value.trim();
  var vid = extractVideoId(url);
  if (!vid) { showToast('Please enter a valid YouTube URL'); return; }
  var exists = playlist.some(function(p){ return p.videoId === vid; });
  if (exists) { showToast('Already in queue'); return; }
  playlist.push({ url: url, videoId: vid, title: 'Track ' + (playlist.length + 1) });
  savePlaylist();
  renderPlaylist();
  showToast('Added to queue ✓');
  urlInput.value = '';
});

// Play / Pause
btnPlayPause.addEventListener('click', togglePlayPause);
function togglePlayPause() {
  if (!playerReady) return;
  if (isPlaying) {
    player.pauseVideo();
  } else {
    if (player.getPlayerState() === -1 || player.getPlayerState() === 5) {
      // Nothing loaded
      showToast('Add a YouTube URL first');
    } else {
      player.playVideo();
    }
  }
}

// Prev / Next
btnPrev.addEventListener('click', playPrev);
btnNext.addEventListener('click', playNext);

function playPrev() {
  if (playlist.length === 0) return;
  currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
  var item = playlist[currentIdx];
  renderPlaylist();
  loadAndPlay(item.videoId, item.title);
}

function playNext() {
  if (playlist.length === 0) return;
  currentIdx = (currentIdx + 1) % playlist.length;
  var item = playlist[currentIdx];
  renderPlaylist();
  loadAndPlay(item.videoId, item.title);
}

// Seek ±10s
btnRew.addEventListener('click', function() {
  if (!playerReady) return;
  var t = player.getCurrentTime();
  player.seekTo(Math.max(0, t - 10), true);
});
btnFwd.addEventListener('click', function() {
  if (!playerReady) return;
  var t = player.getCurrentTime();
  player.seekTo(t + 10, true);
});

// Volume slider
volSlider.addEventListener('input', function() {
  var v = parseInt(this.value);
  if (playerReady) player.setVolume(v);
  volVal.textContent = v + '%';
  isMuted = v === 0;
  volIcon.textContent = v === 0 ? '🔇' : v < 40 ? '🔉' : '🔊';
  if (playerReady) { if (isMuted) player.mute(); else player.unMute(); }
});

// Click to seek on progress bar
progressTrack.addEventListener('click', function(e) {
  if (!playerReady) return;
  var dur = player.getDuration();
  if (!dur) return;
  var rect = progressTrack.getBoundingClientRect();
  var pct  = (e.clientX - rect.left) / rect.width;
  player.seekTo(pct * dur, true);
});

// Clear playlist
btnClearPl.addEventListener('click', function() {
  if (!confirm('Clear the entire playlist?')) return;
  playlist = [];
  currentIdx = -1;
  savePlaylist();
  renderPlaylist();
  if (playerReady) player.stopVideo();
  trackTitle.textContent = 'No track loaded';
  trackSub.textContent   = '— Add a YouTube URL above —';
  artEmoji.textContent   = '🎵';
  artWrap.classList.remove('playing');
  btnPlayPause.textContent = '▶';
  showToast('Playlist cleared');
});

/* -----------------------------------------------
   8.  Progress bar timer
----------------------------------------------- */
function startProgressTimer() {
  stopProgressTimer();
  progressTimer = setInterval(updateProgress, 500);
}
function stopProgressTimer() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
}
function updateProgress() {
  if (!playerReady || !isPlaying) return;
  var cur = player.getCurrentTime() || 0;
  var dur = player.getDuration()    || 0;
  timeCur.textContent = formatTime(cur);
  timeDur.textContent = formatTime(dur);
  progressFill.style.width = dur ? (cur / dur * 100) + '%' : '0%';
}

function formatTime(s) {
  s = Math.floor(s);
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* -----------------------------------------------
   9.  Playlist rendering
----------------------------------------------- */
function renderPlaylist() {
  plCount.textContent = playlist.length + ' track' + (playlist.length !== 1 ? 's' : '');
  if (playlist.length === 0) {
    plList.innerHTML = '';
    plList.appendChild(plEmpty);
    return;
  }
  plEmpty.remove();
  plList.innerHTML = '';
  playlist.forEach(function(item, idx) {
    var div = document.createElement('div');
    div.className = 'pl-item' + (idx === currentIdx ? ' active' : '');
    div.innerHTML =
      '<span class="pl-num">' + (idx + 1) + '</span>' +
      '<div class="pl-info">' +
        '<div class="pl-title">' + escHtml(item.title) + '</div>' +
        '<div class="pl-url">' + escHtml(item.url) + '</div>' +
      '</div>' +
      '<button class="pl-remove" data-idx="' + idx + '" title="Remove">✕</button>';

    // Click item → play it
    div.addEventListener('click', function(e) {
      if (e.target.classList.contains('pl-remove')) return;
      currentIdx = idx;
      renderPlaylist();
      loadAndPlay(item.videoId, item.title);
    });
    plList.appendChild(div);
  });

  // Remove buttons
  plList.querySelectorAll('.pl-remove').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var i = parseInt(this.dataset.idx);
      playlist.splice(i, 1);
      if (currentIdx === i) currentIdx = -1;
      else if (currentIdx > i) currentIdx--;
      savePlaylist();
      renderPlaylist();
    });
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* -----------------------------------------------
   10. Persist playlist
----------------------------------------------- */
function savePlaylist() {
  localStorage.setItem('wl_playlist', JSON.stringify(playlist));
}

/* -----------------------------------------------
   11. Toast notification
----------------------------------------------- */
var toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
}

/* -----------------------------------------------
   12. Loader helper
----------------------------------------------- */
function setLoader(on) {
  loader.classList.toggle('visible', on);
}

/* -----------------------------------------------
   13. Keyboard controls
----------------------------------------------- */
document.addEventListener('keydown', function(e) {
  // Don't intercept when typing in input
  if (e.target === urlInput) return;
  switch(e.code) {
    case 'Space':
      e.preventDefault();
      togglePlayPause();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      playPrev();
      break;
    case 'ArrowRight':
      e.preventDefault();
      playNext();
      break;
    case 'ArrowUp':
      e.preventDefault();
      volSlider.value = Math.min(100, parseInt(volSlider.value) + 5);
      volSlider.dispatchEvent(new Event('input'));
      break;
    case 'ArrowDown':
      e.preventDefault();
      volSlider.value = Math.max(0, parseInt(volSlider.value) - 5);
      volSlider.dispatchEvent(new Event('input'));
      break;
    case 'KeyM':
      e.preventDefault();
      if (isMuted) {
        volSlider.value = 80; isMuted = false;
        volSlider.dispatchEvent(new Event('input'));
      } else {
        volSlider.value = 0; isMuted = true;
        volSlider.dispatchEvent(new Event('input'));
      }
      break;
  }
});

/* -----------------------------------------------
   14. Enter key on URL input → Play
----------------------------------------------- */
urlInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') btnPlayUrl.click();
});

/* -----------------------------------------------
   15. Init
----------------------------------------------- */
renderPlaylist();
</script>
