<div class="card car-card h-100">
    <div class="car-card-img">
        {% if car.image %}
        <img src="{{ car.image.url }}" alt="{{ car }}">
        {% else %}
        <div class="car-card-placeholder"><i class="fa-solid fa-car-side"></i></div>
        {% endif %}
        {% if car.is_featured %}<span class="badge bg-primary car-badge">Featured</span>{% endif %}
    </div>
    <div class="card-body d-flex flex-column">
        <h5 class="card-title mb-1">{{ car.brand }} {{ car.model_name }}</h5>
        <p class="text-secondary small mb-2">{{ car.year }} &middot; {{ car.get_fuel_type_display }} &middot; {{ car.get_transmission_display }}</p>
        <p class="fw-bold text-primary fs-5 mb-3">₹{{ car.price|floatformat:0 }}</p>
        <a href="{% url 'cars:car_detail' car.pk %}" class="btn btn-outline-primary mt-auto">View Details</a>
    </div>
</div>
