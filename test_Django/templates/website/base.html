{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Watertest
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'website/css/style.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% block header %}

    {% block content %}
    {% endblock %}


    {% block footer %}
    {% endblock %}


    <script src="{% static 'website/js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
