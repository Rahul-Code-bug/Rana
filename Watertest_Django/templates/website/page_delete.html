<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Page | Watertest CMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .delete-wrapper {
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
        }

        .delete-box {
            background: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            text-align: center;
        }

        .delete-box h1 {
            margin-top: 0;
            color: #c62828;
        }

        .delete-box p {
            color: #666;
            line-height: 1.6;
        }

        .page-name {
            font-weight: bold;
            color: #222;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-delete {
            background: #c62828;
            color: white;
        }

        .btn-cancel {
            background: #ddd;
            color: #222;
        }

    </style>

</head>

<body>

<div class="delete-wrapper">

    <div class="delete-box">

        <h1>Delete Page?</h1>

        <p>
            Are you sure you want to permanently delete
            the page:
        </p>

        <p class="page-name">
            "{{ page.title }}"
        </p>

        <p>
            This action cannot be undone.
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="button-row">

                <a
                    href="{% url 'pages' %}"
                    class="btn btn-cancel">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-delete">
                    Yes, Delete
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
