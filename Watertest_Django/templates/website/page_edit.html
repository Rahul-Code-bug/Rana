{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Page | Watertest CMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .page-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 8px;
        }

        .page-header p {
            margin: 0;
            color: #777;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
        }

        .help-text {
            display: block;
            margin-top: 8px;
            color: #777;
            font-size: 13px;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .btn-primary {
            background: #0b4f8a;
            color: white;
        }

        .btn-secondary {
            background: #ddd;
            color: #222;
        }

    </style>

</head>

<body>

<div class="page-wrapper">

    <div class="page-header">

        <h1>Edit Page</h1>

        <p>
            Update your Watertest website page.
        </p>

    </div>


    <div class="form-box">

       <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <!-- PAGE TITLE -->

            <div class="form-group">

                <label for="title">
                    Page Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ page.title }}"
                    required>

            </div>


            <!-- URL SLUG -->

            <div class="form-group">

                <label for="slug">
                    URL Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    name="slug"
                    value="{{ page.slug }}"
                    required>

            </div>


            <div class="form-group">

    <label for="featured_image">
        Featured Image / Banner Image
    </label>

    <input
        type="file"
        id="featured_image"
        name="featured_image"
        accept="image/*"
    >

    {% if page.featured_image %}

        <div style="margin-top:15px;">

            <p style="
                margin-bottom:8px;
                color:#555;
                font-weight:bold;
            ">
                Current Banner:
            </p>

            <img
                src="{{ page.featured_image.url }}"
                alt="{{ page.title }}"
                style="
                    max-width:300px;
                    height:150px;
                    object-fit:cover;
                    border-radius:6px;
                    border:1px solid #ddd;
                "
            >

        </div>

    {% endif %}

    <small style="
        display:block;
        margin-top:8px;
        color:#777;
    ">
        Upload a new image only if you want to change
        the current banner.
    </small>

</div>

            <!-- PARENT PAGE -->

            <div class="form-group">

                <label for="parent">
                    Parent Page
                </label>

                <select
                    id="parent"
                    name="parent">

                    <option value="">
                        — No Parent (Top Level Page) —
                    </option>

                    {% for parent_page in parent_pages %}

                        <option
                            value="{{ parent_page.id }}"
                            {% if page.parent and page.parent.id == parent_page.id %}
                                selected
                            {% endif %}>

                            {{ parent_page.title }}

                        </option>

                    {% endfor %}

                </select>

                <small class="help-text">
                    Select a parent page to create a child page.
                </small>

            </div>


            <!-- PAGE CONTENT -->

            <div class="form-group">

                <label for="content">
                    Page Content
                </label>

                <textarea
                    id="content"
                    name="content">{{ page.content }}</textarea>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status">

                    <option
                        value="draft"
                        {% if page.status == "draft" %}selected{% endif %}>

                        Draft

                    </option>

                    <option
                        value="published"
                        {% if page.status == "published" %}selected{% endif %}>

                        Published

                    </option>

                </select>

            </div>


            <!-- SHOW IN MENU -->

            <div class="form-group checkbox-group">

                <input
                    type="checkbox"
                    id="show_in_menu"
                    name="show_in_menu"
                    {% if page.show_in_menu %}checked{% endif %}>

                <label for="show_in_menu">
                    Show this page in navigation
                </label>

            </div>


            <!-- MENU ORDER -->

            <div class="form-group">

                <label for="menu_order">
                    Menu Order
                </label>

                <input
                    type="number"
                    id="menu_order"
                    name="menu_order"
                    value="{{ page.menu_order }}"
                    min="0">

            </div>


            <!-- BUTTONS -->

            <div class="button-row">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Update Page

                </button>

                <a
                    href="{% url 'pages' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
