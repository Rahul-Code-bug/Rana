{% for page in pages %}

<li>

    <a href="/{{ page.get_url_path }}">

        {{ page.title }}

        {% if page.children.all %}
            <span class="footer-menu-arrow">▼</span>
        {% endif %}

    </a>


    {% if page.children.all %}

        <ul class="footer-sub-menu">

            {% include "website/footer_menu_items.html" with pages=page.children.all %}

        </ul>

    {% endif %}

</li>

{% endfor %}
